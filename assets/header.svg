<svg width="800" height="56" viewBox="0 0 800 56" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 36px;
      font-weight: 600;
      fill: #6366f1;
      animation: fadeIn 2s ease-in-out both;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
  <text x="0" y="42" class="title">Hi, I'm Petri</text>
</svg>
