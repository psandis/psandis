<svg width="800" height="80" viewBox="0 0 800 80" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 36px;
      font-weight: 600;
      fill: #1a1a2e;
      opacity: 0;
      animation: fadeIn 2s ease-in-out forwards;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 16px;
      fill: #555;
      opacity: 0;
      animation: fadeIn 2s ease-in-out 0.8s forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
  <text x="0" y="42" class="title">Hi, I'm Petri</text>
  <text x="2" y="66" class="subtitle">Engineering Leader &amp; Builder</text>
</svg>
